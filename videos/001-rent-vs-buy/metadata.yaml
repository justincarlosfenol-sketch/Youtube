calculator_path: rent-vs-buy
hook: |
  Right now the mortgage payment on a median-priced US home ({{pi|money}}/mo at {{rate_pct|pct}}) is the same as the typical single-family rent ({{rent|money}}). So why does the renter stay richer for {{be|y1}} years?

  We built a month-by-month model of renting vs buying with November 2026 data — same budget for both households, every assumption sourced — and found the breakeven year. Then we stress-tested the three numbers that decide it for you: home appreciation, your mortgage rate, and your local price-to-rent ratio. Plus the one habit that drops the breakeven to {{be_spender|y1}} years.
assumptions:
  - "Home price {{price|money}} (NAR median, Oct 2026); 20% down; 30-yr fixed at {{rate_pct|pct}} (Freddie Mac, 12 Nov 2026)"
  - "Rent {{rent|money}}/mo (Zillow single-family ZORI, Oct 2026), growing 3%/yr"
  - "Home appreciation 4%/yr; renter's portfolio 7%/yr; 15% capital-gains tax on the renter's gains"
  - "Property tax 0.9%, insurance $3,012/yr (+3%/yr), maintenance 1%/yr, buyer closing costs 2%, selling costs 6%"
  - "Each month the household with cheaper housing invests the difference. Mortgage-interest deduction not modelled (it can shorten the breakeven, especially for single filers)."
  - "Net worth = what each household would walk away with if they sold/liquidated that month."
